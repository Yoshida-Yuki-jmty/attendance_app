services:
  db:
    build:
      context: .
      dockerfile: dockerfiles/dev/postgresql/Dockerfile
    container_name: attendance-db
    env_file: .env
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
      TZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: dockerfiles/dev/rails/Dockerfile
      target: development
    container_name: attendance-web
    env_file: .env
    environment:
      RAILS_ENV: development
      AUTO_DB_PREPARE: "1"
      DATABASE_URL: ${DATABASE_URL}
      BUNDLE_WITHOUT: "" 
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - bundle_cache:/usr/local/bundle
    command: ["bin/dev"]
    tty: true
    stdin_open: true

volumes:
  pgdata:
  bundle_cache:
  node_modules:
